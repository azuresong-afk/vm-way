name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vm
          POSTGRES_PASSWORD: vm
          POSTGRES_DB: vm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vm" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Фикстура «Сканера» совпадает с генератором
        run: python -m app.integrations.scanner.fixtures.generate | diff -q - app/integrations/scanner/fixtures/demo.json
      - run: pytest -q
        env:
          VM_TEST_PG_URL: postgresql+psycopg://vm:vm@localhost:5432/vm_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    # Критерий задачи 1.8: `docker compose up --build` поднимает всё. Собираем оба
    # образа, поднимаем стек с демо-данными и проверяем его через nginx.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: .env со случайными секретами (демо-стенд)
        run: scripts/gen-env.sh --demo
      - name: Сборка образов app и web
        run: docker compose build
      - name: Запуск стека и ожидание healthy
        run: docker compose up -d --wait --wait-timeout 300
      - name: Smoke-проверка через веб
        run: scripts/smoke.sh
      - name: Резервная копия и восстановление
        run: |
          scripts/backup.sh backups/ci
          scripts/restore.sh backups/ci --yes
          docker compose up -d --wait --wait-timeout 300
          scripts/smoke.sh
      # Сквозной тест интерфейса (e2e/): вход, импорт, заявка, раскатка, повторная проверка.
      - name: Сквозной тест интерфейса (Playwright)
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Отчёт Playwright при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Логи при ошибке
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Остановка
        if: always()
        run: docker compose down -v
