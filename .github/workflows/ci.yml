name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vm
          POSTGRES_PASSWORD: vm
          POSTGRES_DB: vm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vm" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Фикстура «Сканера» совпадает с генератором
        run: python -m app.integrations.scanner.fixtures.generate | diff -q - app/integrations/scanner/fixtures/demo.json
      - run: pytest -q
        env:
          VM_TEST_PG_URL: postgresql+psycopg://vm:vm@localhost:5432/vm_test
